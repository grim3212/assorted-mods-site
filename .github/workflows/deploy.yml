name: Deploy

# Manual only. Run it from the Actions tab when you want the site published.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: www.assortedmods.com
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn generate

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed bundles first, so no page can reference a file that is not up yet.
      - name: Sync hashed assets
        run: |
          aws s3 sync .output/public/_nuxt "s3://$BUCKET/_nuxt" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync pages and assets
        run: |
          aws s3 sync .output/public "s3://$BUCKET" \
            --delete \
            --exclude "_nuxt/*" \
            --cache-control "public,max-age=300"
